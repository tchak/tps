name: 'Setup Rails assets'
description: 'Pre-compile and cache the app assets'

runs:
  using: composite
  steps:
    - name: Assets cache
      uses: actions/cache@v6
      id: cache
      with:
        path: |
          public/assets-test
          public/vite-test
        key: asset-cache-v3-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock', 'patches/**/*.patch', 'app/javascript/**', 'app/assets/**', 'vite.config.ts', 'config/vite.json', 'tsconfig.json', 'lingui.config.ts') }}
        restore-keys: |
          asset-cache-v3-${{ runner.os }}-${{ hashFiles('package.json', 'patches/**/*.patch', 'app/javascript/**', 'app/assets/**') }}
          asset-cache-v3-${{ runner.os }}-${{ hashFiles('package.json', 'patches/**/*.patch') }}
          asset-cache-v3-${{ runner.os }}-

    - name: Setup bun and node modules
      uses: ./.github/actions/ci-setup-bun-node
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Precompile assets
      env:
        RAILS_ENV: test
      run: bin/rails assets:precompile --trace
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
